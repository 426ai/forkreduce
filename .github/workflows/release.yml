name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Require the tag to match the package version
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          name = os.environ["GITHUB_REF_NAME"]
          if not ref.startswith("refs/tags/v"):
              raise SystemExit(
                  f"Release must run from a v* tag (got {ref}). "
                  "Push a tag, or dispatch this workflow on that tag."
              )
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = pyproject["project"]["version"]
          init = Path("src/forkreduce/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', init, flags=re.MULTILINE)
          if match is None or match.group(1) != version:
              found = match.group(1) if match else "(missing)"
              raise SystemExit(f"__version__ is {found}, pyproject version is {version}")
          expected = f"v{version}"
          if name != expected:
              raise SystemExit(f"tag {name} does not match package version {version} (expected {expected})")
          print(f"tag {name} matches package version {version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Attestations default to on and need `attestations: write`. This publisher
      # is registered with id-token only, so keep the upload to trusted publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
