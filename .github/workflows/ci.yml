name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["temporal", "openai,temporal,full"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,${{ matrix.extras }}]" "pydantic-ai-slim[temporal]>=2.57,<3"
      - name: Install benchmark dependencies
        if: matrix.extras != 'temporal'
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Verify provider-free slim installation
        if: matrix.extras == 'temporal'
        run: |
          python -c "from importlib.util import find_spec; assert find_spec('openai') is None"
          python -c "from importlib.metadata import distributions; assert 'pydantic-ai' not in {d.metadata['Name'].lower().replace('_', '-') for d in distributions()}"
      - name: Ruff
        run: |
          ruff check src tests examples benchmarks
          ruff format --check src tests examples benchmarks
      - name: Type check
        run: mypy
      - name: Tests
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: |
          if [ "${{ matrix.extras }}" = "temporal" ]; then
            python -m pytest --ignore-glob='tests/test_bench_*.py'
          else
            python -m pytest
          fi
      - name: Offline benchmark smoke (no provider requests)
        if: matrix.extras != 'temporal'
        env:
          PYDANTIC_AI_NO_BANNER: "1"
        run: python -m benchmarks smoke
